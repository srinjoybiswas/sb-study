<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — Admin</title>
  <link rel="icon" href="../assets/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="app-shell admin-shell">
    <aside class="sidebar">
      <div class="side-brand"><span class="logo-mark">SB</span><div>SB Notes<small>Admin Panel</small></div></div>
      <nav class="side-nav">
        <div class="nav-section">Overview</div>
        <a href="admin-dashboard.html"><span class="nav-ico">📊</span> Dashboard</a>
        <a href="activity.html"><span class="nav-ico">🕒</span> Activity</a>
        <div class="nav-section">Manage</div>
        <a href="students.html"><span class="nav-ico">👥</span> Students</a>
        <a href="departments.html"><span class="nav-ico">🏛</span> Departments</a>
        <a href="notes.html"><span class="nav-ico">📚</span> Notes</a>
        <a href="tests.html"><span class="nav-ico">📝</span> Tests</a>
        <a href="announcements.html"><span class="nav-ico">📢</span> Announcements</a>
        <div class="nav-section">System</div>
        <a href="settings.html"><span class="nav-ico">⚙️</span> Settings</a>
        <a href="admin-profile.html"><span class="nav-ico">👤</span> Profile</a>
        <a href="#" data-admin-logout><span class="nav-ico">🚪</span> Logout</a>
      </nav>
    </aside>
    <div class="sidebar-overlay"></div>

    <div class="main-area">
      <header class="topbar">
        <button class="menu-btn" aria-label="Menu">☰</button>
        <div class="welcome">Students <span class="admin-badge">ADMIN</span><small>Manage student accounts</small></div>
        <div class="top-actions">
          <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme"><span data-theme-icon>🌙</span></button>
          <div class="avatar" data-admin-avatar>?</div>
        </div>
      </header>

      <main class="page">
        <div class="page-head"><h1>Students</h1><p>Search, filter and manage student accounts.</p></div>
        <div class="toolbar">
          <div class="search-box"><span class="s-ico">🔍</span><input class="form-control" type="search" id="student-search" placeholder="Search by name, email, mobile or ID…"></div>
          <select class="form-control" id="filter-status">
            <option value="ALL">All Status</option>
            <option value="ACTIVE">Active</option>
            <option value="BLOCKED">Blocked</option>
            <option value="INACTIVE">Inactive</option>
          </select>
          <select class="form-control" id="filter-department"><option value="ALL">All Departments</option></select>
        </div>
        <div id="students-table"></div>
        <div class="pagination" id="students-pagination"></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="student-detail-modal">
    <div class="modal modal-lg">
      <div class="modal-header"><h3>Student Detail</h3><button class="btn btn-ghost btn-sm" id="student-detail-close">✕</button></div>
      <div class="modal-body" id="student-detail-body"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/admin-auth.js"></script>
  <script src="../js/admin/students.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Builder — Admin</title>
  <link rel="icon" href="../assets/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="app-shell admin-shell">
    <aside class="sidebar">
      <div class="side-brand"><span class="logo-mark">SB</span><div>SB Notes<small>Admin Panel</small></div></div>
      <nav class="side-nav">
        <div class="nav-section">Overview</div>
        <a href="admin-dashboard.html"><span class="nav-ico">📊</span> Dashboard</a>
        <a href="activity.html"><span class="nav-ico">🕒</span> Activity</a>
        <div class="nav-section">Manage</div>
        <a href="students.html"><span class="nav-ico">👥</span> Students</a>
        <a href="departments.html"><span class="nav-ico">🏛</span> Departments</a>
        <a href="notes.html"><span class="nav-ico">📚</span> Notes</a>
        <a href="tests.html"><span class="nav-ico">📝</span> Tests</a>
        <a href="announcements.html"><span class="nav-ico">📢</span> Announcements</a>
        <div class="nav-section">System</div>
        <a href="settings.html"><span class="nav-ico">⚙️</span> Settings</a>
        <a href="admin-profile.html"><span class="nav-ico">👤</span> Profile</a>
        <a href="#" data-admin-logout><span class="nav-ico">🚪</span> Logout</a>
      </nav>
    </aside>
    <div class="sidebar-overlay"></div>

    <div class="main-area">
      <header class="topbar">
        <button class="menu-btn" aria-label="Menu">☰</button>
        <div class="welcome">Test Builder <span class="admin-badge">ADMIN</span><small>Configure test and questions</small></div>
        <div class="top-actions">
          <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme"><span data-theme-icon>🌙</span></button>
          <div class="avatar" data-admin-avatar>?</div>
        </div>
      </header>

      <main class="page">
        <div class="page-head"><h1 id="builder-title">Create Test</h1><p>Set the test details, then add questions.</p></div>

        <div class="card mb-24">
          <form id="test-form">
            <div class="form-row">
              <div class="form-group"><label for="test-title">Title</label><input class="form-control" type="text" id="test-title" name="title" required></div>
              <div class="form-group"><label for="test-department">Department</label><select class="form-control" id="test-department" name="departmentId"><option value="">All Departments</option></select></div>
            </div>
            <div class="form-group"><label for="test-desc">Description</label><textarea class="form-control" id="test-desc" name="description" rows="2"></textarea></div>
            <div class="form-row">
              <div class="form-group"><label for="test-semester">Semester</label><input class="form-control" type="text" id="test-semester" name="semester" placeholder="e.g. 3"></div>
              <div class="form-group"><label for="test-priority">Priority</label>
                <select class="form-control" id="test-priority" name="priority">
                  <option value="OPTIONAL">Optional</option>
                  <option value="REQUIRED">Required</option>
                  <option value="CRITICAL">Critical / Emergency</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group"><label for="test-start">Start Date</label><input class="form-control" type="date" id="test-start" name="startDate"></div>
              <div class="form-group"><label for="test-end">End Date</label><input class="form-control" type="date" id="test-end" name="endDate"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label for="test-marks">Marks per Question</label><input class="form-control" type="number" id="test-marks" name="marksPerQuestion" value="1" min="1"></div>
              <div class="form-group"><label for="test-time">Time per Question (seconds)</label><input class="form-control" type="number" id="test-time" name="timePerQuestion" value="60" min="10"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label for="test-pass">Passing %</label><input class="form-control" type="number" id="test-pass" name="passingPercent" value="60" min="1" max="100"></div>
              <div class="form-group"><label for="test-status">Status</label>
                <select class="form-control" id="test-status" name="status"><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group"><label><input type="checkbox" name="randomizeQuestions"> Randomize questions</label></div>
              <div class="form-group"><label><input type="checkbox" name="randomizeOptions"> Randomize options</label></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label><input type="checkbox" name="cameraRequired"> Request camera (proctoring)</label></div>
              <div class="form-group"><label><input type="checkbox" name="antiCheating"> Enable anti-cheating monitoring</label></div>
            </div>
            <p class="form-hint" id="total-time-preview"></p>
            <button class="btn btn-primary mt-16" type="submit">Save Test</button>
          </form>
        </div>

        <div class="card hidden" id="questions-section">
          <div class="card-header"><h2 class="card-title">Questions</h2><button class="btn btn-primary btn-sm" id="add-question-btn">+ Add Question</button></div>
          <div id="questions-list"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="question-modal">
    <div class="modal modal-lg">
      <div class="modal-header"><h3 id="question-modal-title">Add Question</h3><button class="btn btn-ghost btn-sm" id="question-modal-close">✕</button></div>
      <form id="question-form">
        <div class="modal-body">
          <div class="form-group"><label for="q-text">Question</label><textarea class="form-control" id="q-text" name="questionText" rows="2" required></textarea></div>
          <div class="form-group"><label for="q-a">Option A</label><input class="form-control" type="text" id="q-a" name="optionA"></div>
          <div class="form-group"><label for="q-b">Option B</label><input class="form-control" type="text" id="q-b" name="optionB"></div>
          <div class="form-group"><label for="q-c">Option C</label><input class="form-control" type="text" id="q-c" name="optionC"></div>
          <div class="form-group"><label for="q-d">Option D</label><input class="form-control" type="text" id="q-d" name="optionD"></div>
          <div class="form-row">
            <div class="form-group"><label for="q-correct">Correct Answer</label>
              <select class="form-control" id="q-correct" name="correctAnswer"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
            </div>
            <div class="form-group"><label for="q-marks">Marks</label><input class="form-control" type="number" id="q-marks" name="marks" value="1" min="1"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" id="question-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Question</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/admin-auth.js"></script>
  <script src="../js/admin/test-builder.js"></script>
  <script>document.getElementById('question-cancel').onclick = () => UI.closeModal('question-modal');</script>
</body>
</html>

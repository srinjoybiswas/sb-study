<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="side-brand"><span class="logo-mark">SB</span><div>SB Notes<small>Student Portal</small></div></div>
      <nav class="side-nav">
        <div class="nav-section">Main</div>
        <a href="dashboard.html"><span class="nav-ico">🏠</span> Dashboard</a>
        <a href="notes.html?scope=mine"><span class="nav-ico">📚</span> My Notes</a>
        <a href="notes.html?scope=other"><span class="nav-ico">🌐</span> Other Notes</a>
        <a href="test.html"><span class="nav-ico">📝</span> Tests</a>
        <a href="result.html"><span class="nav-ico">📊</span> Results</a>
        <a href="certificate.html"><span class="nav-ico">🏆</span> Certificates</a>
        <div class="nav-section">Account</div>

      <header class="topbar">
        <button class="menu-btn" aria-label="Menu">☰</button>
        <div class="welcome">Notifications<small>Stay up to date</small></div>
        <div class="top-actions">

      <main class="page">

          <div><h1>Notifications</h1><p>New notes, tests, results and announcements.</p></div>
          <button class="btn btn-outline btn-sm" id="mark-all-read">Mark all as read</button>
        </div>
        <div class="card"><div id="notif-full-list"></div></div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
